name: Paper engine
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validation:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install '.[research]'
      - run: python -m unittest discover -s tests -t .
      - run: quantos demo --state "$RUNNER_TEMP/quantos-demo"
