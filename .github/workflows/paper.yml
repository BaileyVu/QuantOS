name: Paper engine
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validation:
    runs-on: macos-latest
    timeout-minutes: 30  # a hung test must not hold the macOS runners for 6h
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install native library for retained research tests
        run: brew install libomp
      - run: python -m pip install '.[research]'
      - run: python -m unittest discover -s tests -t .
      - name: Validate preserved legacy research and V1 tests
        env:
          PYTHONPATH: legacy/v1_v3:legacy/v1_v3/src
          PYTHONSAFEPATH: '1'  # keep the root tests/ package off sys.path (also in subprocesses)
        run: python -m unittest discover -s legacy/v1_v3/tests -t legacy/v1_v3
      - run: quantos demo --state "$RUNNER_TEMP/quantos-demo"
