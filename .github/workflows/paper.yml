name: Paper engine
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validation:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install native library for retained research tests
        run: brew install libomp
      - run: python -m pip install '.[research]'
      - run: python -m unittest discover -s tests -t .
      - name: Validate preserved legacy research and V1 tests
        env:
          PYTHONSAFEPATH: '1'
          PYTHONPATH: legacy_assets:legacy_assets/src
        run: python -m unittest discover -s legacy_assets/tests -t legacy_assets
      - run: quantos demo --state "$RUNNER_TEMP/quantos-demo"
