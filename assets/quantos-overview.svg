<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">QuantOS architecture overview</title>
  <desc id="description">A research-first quantitative trading workflow from market data through features, alpha, risk, execution, and evaluation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#102640"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#42d3ad"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#8ca9c9" stroke-opacity=".08"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020813" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#background)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>
  <path d="M70 104H1130" stroke="url(#accent)" stroke-width="2" stroke-opacity=".55"/>
  <text x="70" y="66" fill="#f4f8fc" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">QuantOS</text>
  <text x="70" y="91" fill="#9eb5ce" font-family="Segoe UI, Arial, sans-serif" font-size="15">research-first systematic trading workflow</text>

  <g font-family="Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(70 142)">
      <rect width="184" height="94" rx="14" fill="#10243a" stroke="#315776"/>
      <circle cx="27" cy="28" r="11" fill="#58a6ff"/>
      <path d="M21 28h12M27 22v12" stroke="#07111d" stroke-width="2" stroke-linecap="round"/>
      <text x="22" y="61" fill="#eef6ff" font-size="16" font-weight="700">Market data</text>
      <text x="22" y="80" fill="#9eb5ce" font-size="12">completed 1m candles</text>
    </g>
    <g transform="translate(286 142)">
      <rect width="184" height="94" rx="14" fill="#102e38" stroke="#34756f"/>
      <circle cx="27" cy="28" r="11" fill="#42d3ad"/>
      <path d="M21 30l4-5 4 3 5-7" fill="none" stroke="#07111d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="22" y="61" fill="#effff9" font-size="16" font-weight="700">Features</text>
      <text x="22" y="80" fill="#a6cbc3" font-size="12">deterministic inputs</text>
    </g>
    <g transform="translate(502 142)">
      <rect width="184" height="94" rx="14" fill="#1c2942" stroke="#596cab"/>
      <circle cx="27" cy="28" r="11" fill="#93a4ff"/>
      <path d="M22 31c3-8 8-8 11 0M22 25c3 8 8 8 11 0" fill="none" stroke="#10172a" stroke-width="2" stroke-linecap="round"/>
      <text x="22" y="61" fill="#f4f5ff" font-size="16" font-weight="700">Alpha</text>
      <text x="22" y="80" fill="#bac4f5" font-size="12">strategy decision</text>
    </g>
    <g transform="translate(718 142)">
      <rect width="184" height="94" rx="14" fill="#30253d" stroke="#895a96"/>
      <circle cx="27" cy="28" r="11" fill="#d789ef"/>
      <path d="M22 28l4 4 7-9" fill="none" stroke="#1a1021" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="22" y="61" fill="#fff4ff" font-size="16" font-weight="700">Risk</text>
      <text x="22" y="80" fill="#ddbfdf" font-size="12">approve or reject</text>
    </g>
    <g transform="translate(934 142)">
      <rect width="184" height="94" rx="14" fill="#34291d" stroke="#9b7643"/>
      <circle cx="27" cy="28" r="11" fill="#f4c56b"/>
      <path d="M22 23h10v10H22zM25 26h4" fill="none" stroke="#1d160d" stroke-width="2" stroke-linejoin="round"/>
      <text x="22" y="61" fill="#fff9ec" font-size="16" font-weight="700">Execution</text>
      <text x="22" y="80" fill="#dcc89d" font-size="12">paper first</text>
    </g>
  </g>

  <g fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M254 189h24m-8-8 8 8-8 8"/>
    <path d="M470 189h24m-8-8 8 8-8 8"/>
    <path d="M686 189h24m-8-8 8 8-8 8"/>
    <path d="M902 189h24m-8-8 8 8-8 8"/>
  </g>

  <g transform="translate(70 282)">
    <rect width="1048" height="78" rx="14" fill="#0b1d30" stroke="#315776"/>
    <rect x="0" width="8" height="78" rx="4" fill="url(#accent)"/>
    <text x="30" y="34" fill="#eff8ff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Evaluation &amp; monitoring</text>
    <text x="30" y="57" fill="#9eb5ce" font-family="Segoe UI, Arial, sans-serif" font-size="13">Backtests · walk-forward checks · Monte Carlo · paper-trading records · explicit live approval</text>
    <text x="966" y="46" fill="#42d3ad" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">fail closed</text>
  </g>
</svg>
