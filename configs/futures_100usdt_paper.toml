# Canonical live-market paper profile. Real order submission is disabled.
[futures]
symbol = "BTCUSDT"
starting_equity = "100"
lookback = 120
timeframes = ["1m", "3m", "5m", "15m", "30m", "1h"]
entry_timeframes = ["1m", "3m", "5m", "15m"]
context_timeframes = ["15m", "30m", "1h"]
enabled_strategies = ["trend_continuation", "breakout_expansion"]

[risk]
risk_fraction = "0.01"
maximum_risk_fraction = "0.02"
daily_loss_fraction = "0.03"
consecutive_loss_limit = 3
consecutive_loss_cooldown_minutes = 240
consecutive_loss_reset_on_utc_day = true
margin_fraction = "0.80"
leverage_ceiling = 5
emergency_leverage_ceiling = 10
liquidation_buffer_fraction = "0.01"
maintenance_margin_fraction = "0.005"
maximum_slippage_rate = "0.0002"
maximum_fee_rate = "0.0005"
minimum_net_reward_risk = "2.0"
minimum_reward_to_execution_cost = "5.0"
minimum_expected_movement_to_cost_multiple = "3"

[paper]
maker_fee_rate = "0.0002"
taker_fee_rate = "0.0005"
slippage_rate = "0.0002"

[position_management]
breakeven_activation_r = "1.0"
breakeven_safety_buffer_r = "0.05"
profit_lock_activation_r = "1.5"
profit_lock_floor_r = "0.5"
runner_activation_r = "2"
minimum_development_r = "0.35"
atr_multiplier_tight = "1.25"
atr_multiplier_medium = "1.75"
atr_multiplier_wide = "2.25"
structure_lookback = 5
minimum_stop_adjustment_ticks = 2
time_stop_bars_1m = 12
time_stop_bars_3m = 10
time_stop_bars_5m = 8
time_stop_bars_15m = 6
time_stop_bars_30m = 5
time_stop_bars_1h = 4
