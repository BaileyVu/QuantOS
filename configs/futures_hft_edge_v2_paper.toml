# EDGE V2 PAPER RESEARCH CONFIG
#
# Purpose:
# Validate execution economics of the empirically selected BTCUSDC edge:
#   abs(VAMP alpha) >= 0.10 bps
#   directional standardized OBI >= 1.0 sigma
#   signed aggressive flow confirms direction
#
# adverse_selection_bps and safety_buffer_bps are intentionally zero ONLY
# in this PAPER research config so post-fill markouts measure them empirically.
# Do not use this file for authenticated MAINNET execution.

[hft]
preferred_symbol = "BTCUSDC"
fallback_symbol = "BTCUSDT"
starting_equity = "100"
maximum_staleness_ms = 1500
websocket_read_timeout_ms = 1000
websocket_open_timeout_seconds = 5
snapshot_timeout_seconds = 5
bootstrap_timeout_seconds = 10
heartbeat_seconds = 5
reconnect_delay_ms = 500
shutdown_timeout_seconds = 3
clock_calibration_timeout_seconds = 10
clock_recalibration_seconds = 300
clock_calibration_samples = 5
clock_low_rtt_samples = 3
clock_negative_latency_tolerance_ms = "5"
clock_excessive_negative_limit = 3
simulated_acknowledgement_ms = 25
checkpoint_events = 1000

[features]
depth_levels = 5
obi_window = 100
trade_flow_seconds = "5"
volatility_seconds = "10"

[alpha]
minimum_abs_obi_z = "1.0"
require_signed_flow_confirmation = true
minimum_abs_alpha_bps = "0.10"
require_directional_obi_confirmation = true
maximum_spread_bps = "5"
maximum_volatility_bps = "20"
maximum_quote_age_ms = 2000
severe_reversal_bps = "5"

[risk]
maximum_leverage = "5"
maximum_inventory_notional = "100"
maximum_position_quantity = "1"
maximum_account_loss_fraction = "0.01"
daily_loss_fraction = "0.03"
adverse_fill_limit = 5
adverse_selection_bps = "0"
safety_buffer_bps = "0"
emergency_move_bps = "20"
funding_allowance_bps = "0"

# Explicit operator inputs. Verify against the current Binance account tier
# before each paper session. No rebate is assumed.
[fees.BTCUSDC]
maker_rate = "0"
taker_rate = "0.0004"

[fees.BTCUSDT]
maker_rate = "0.0002"
taker_rate = "0.0005"
