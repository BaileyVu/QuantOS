[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantos-pm"
version = "0.1.0"
description = "Isolated public-data-only Polymarket paper engine"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
shadow = ["websockets==16.0", "pyarrow==23.0.1"]

[tool.setuptools.packages.find]
include = ["quantos_pm*"]
