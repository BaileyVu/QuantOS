[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantos"
version = "0.1.0"
description = "QuantOS V1 quantitative trading engine"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "QuantOS" }]
dependencies = []

[project.scripts]
quantos = "quantos.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
