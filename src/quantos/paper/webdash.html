<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuantOS Live Dashboard</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#1b1f24;--mut:#6a7280;--bd:#dde0e5;--ok:#1a9e55;--warn:#d98a00;--bad:#d63a3a;--off:#9aa1ab;--acc:#2f6fdb;--okbg:#e3f5ea;--warnbg:#fdf1d8;--badbg:#fbe3e3;--offbg:#eceef1}

.pos{color:var(--ok)}.neg{color:var(--bad)}.mut{color:var(--mut)}.small{font-size:11px}

.stage:not(:last-child)::after{content:"\2192";position:absolute;right:-16px;top:8px;color:var(--mut);font-size:14px}
.stage.ok{border-left-color:var(--ok)}.stage.warn{border-left-color:var(--warn)}.stage.bad{border-left-color:var(--bad)}.stage.off{border-left-color:var(--off)}
.stage b{font-size:12px}.stage .ev{font-size:10.5px;color:var(--mut);overflow-wrap:anywhere;margin-top:2px}
.flowrow{margin:6px 0}.flowrow>.lbl{font-weight:600;margin-bottom:3px}

.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin:8px 0}
.kv div{background:var(--bg);border-radius:6px;padding:4px 7px}.kv span{display:block;font-size:10.5px;color:var(--mut)}.kv b{font-size:14px}
.bar{height:8px;background:var(--offbg);border-radius:4px;overflow:hidden;display:inline-block;width:70px;vertical-align:middle}.bar i{display:block;height:100%;background:var(--acc)}
.cbar{position:relative;height:10px;background:var(--offbg);border-radius:4px;min-width:120px}.cbar:before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--mut)}.cbar i{position:absolute;top:0;bottom:0;border-radius:3px}
.a-critical{border-left:4px solid var(--bad)}.a-warn{border-left:4px solid var(--warn)}.a-recovered{border-left:4px solid var(--ok)}
.alert{padding:3px 8px;margin:3px 0;background:var(--bg);border-radius:4px}
body{background:linear-gradient(180deg,var(--bg),var(--bg2)) fixed}
:root{--bg2:#e9edf5;--sh:0 1px 2px rgba(20,30,50,.06),0 6px 18px rgba(20,30,50,.07)}
@media(prefers-color-scheme:dark){:root{--bg2:#0b0e13;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35)}}
.card{border-radius:14px;box-shadow:var(--sh);padding:14px}
h2{font-size:12px;display:flex;align-items:center;gap:6px}
.hero{border-radius:18px;padding:16px 18px;margin:8px 0;color:#fff;background:linear-gradient(135deg,#2f6fdb,#6a4fe0 60%,#8a3fd0);box-shadow:var(--sh)}
.hero.warn{background:linear-gradient(135deg,#d98a00,#e0662a)}.hero.bad{background:linear-gradient(135deg,#d63a3a,#a8245a)}
.hero .hs{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.hero .hg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.hero .hg div span{display:block;font-size:11px;opacity:.8;text-transform:uppercase;letter-spacing:.05em}.hero .hg b{font-size:22px;font-weight:700}
.hero .sub{font-size:11px;opacity:.85}
.stage{border-radius:10px;transition:box-shadow .2s}.stage:hover{box-shadow:var(--sh)}
.dot.live{animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,194,122,.6)}70%{box-shadow:0 0 0 7px rgba(61,194,122,0)}100%{box-shadow:0 0 0 0 rgba(61,194,122,0)}}
.stage.ok .sd{background:var(--ok);animation:pulse 2s infinite}.sd{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--off)}.stage.warn .sd{background:var(--warn)}.stage.bad .sd{background:var(--bad)}
.empty{padding:14px;text-align:center;color:var(--mut);background:var(--bg);border-radius:10px;font-size:12px}
.kv div{border-radius:10px}[title]{cursor:help}.hint{border-bottom:1px dotted var(--mut)}
.chip{transition:background .3s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main>
<div class="top"><h1>QuantOS live dashboard <span class="small mut" title="Both runs trade a $50 test account. Paper run is simulated; the demo run mirrors orders to Binance Demo.">(what is this?)</span></h1><div id="upd" class="mut">connecting...</div></div>
<div id="banner"></div>

<script>

/* ---------- health ---------- */

 if(isDemo(r)){var m=r.mirror,ms=m?Object.keys(m).map(function(k){return m[k].state}):[],rf=lastFeed(r,["EXCHANGE_RECONCILE_FAILED"]);
  var mc=(ms.indexOf("FAILED")>=0||ms.indexOf("CLOSE_FAILED")>=0||rf)?"bad":(m==null?"warn":"ok");
  S.push({n:"Exchange mirror / recon",c:mc,e:m==null?"idle (nothing traded yet)":ms.length+" orders: "+ms.join(",")+(rf?" | "+evText(rf):"")})}
 else S.push({n:"Reconciliation",c:e.reconciled===false?"bad":"ok",e:e.reconciled===false?"not reconciled":"reconciled"});
 return S}
function renderFlow(){var root=$("flow");root.textContent="";D.runs.forEach(function(r){var row=el("div","flowrow"),fl=el("div","flow");

 stages(r).forEach(function(s){var d=el("div","stage "+s.c);if(s.t)d.title=s.t;add(d,el("span","sd"),el("b",null,s.n),el("div","ev",s.e));fl.appendChild(d)});row.appendChild(fl);root.appendChild(row)})}

/* ---------- run cards ---------- */

function kv(p,k,v){var d=el("div"),sp=el("span");add(sp,k);d.appendChild(sp);var b=el("b");add.apply(null,[b].concat(Array.isArray(v)?v:[v]));d.appendChild(b);p.appendChild(d)}
function renderRuns(){var root=$("runs");root.textContent="";D.runs.forEach(function(r){
 var e=eng(r),st=r.status||{},run=r.run||{},card=el("div","card"),eq=num(e.equity),pnl=eq==null?null:eq-50;

 var dl=el("span",null,countdown(run.deadline_ms));dl.setAttribute("data-dl",run.deadline_ms);dl.title=run.deadline_ms?new Date(run.deadline_ms).toISOString():"";kv(g,"Deadline in",dl);
 card.appendChild(g);
 var sl=el("div","small"),slots=r.slots||{};add(sl,tip("Slots","Each strategy family (crash / event / trend) may hold only this many open positions at once, to limit risk."),el("span","mut"," "));
 Object.keys(slots).forEach(function(k){var s=slots[k],pct=s.max?Math.min(100,s.used/s.max*100):0,b=el("span","bar"),i=el("i");i.style.width=pct+"%";b.appendChild(i);add(sl,k+" ",b," "+s.used+"/"+s.max+"  ")});card.appendChild(sl);
 var chips=el("div");chips.style.margin="6px 0";add(chips,chipT("scans/h "+(r.scans_last_hour==null?"?":r.scans_last_hour),"Market scans completed in the last hour",""),chip("errors/h "+(r.errors_last_hour==null?"?":r.errors_last_hour),(r.errors_last_hour>0)?"warn":"ok"));
 var rr=r.reject_reasons||{},ks=Object.keys(rr).slice(0,3);ks.forEach(function(k){add(chips,chipT(k+" x"+rr[k],k==="BELOW_EXCHANGE_MINIMUM"?"Min-notional skip: the trade was too small for the exchange minimum order size, so it was skipped.":"Risk check rejected the signal","warn"))});if(!ks.length)add(chips,chip("no rejects","off"));
 var cnts=r.counts||{};Object.keys(cnts).forEach(function(k){add(chips,chip(k+" "+cnts[k]))});card.appendChild(chips);
 var ops=e.open_positions||[];
 card.appendChild(table([["Symbol"],["Side"],["Strategy"],["Entry",1],["Stop",1],["Mark",1],["Unreal.",1]],ops.map(function(p){
  var av=num(p.average),mk=num(p.last_mark),u=(num(p.filled)!=null&&av!=null&&mk!=null)?num(p.filled)*(mk-av)*(p.side==="LONG"?1:-1):null;
  return [p.symbol,p.side,p.strategy_id,f(av,4),f(p.stop_price||p.stop_loss,4),f(mk,4),cn(u,u==null?"-":money(u))]}),"No positions yet \u2014 waiting for a signal"));
 root.appendChild(card)})}

 var b=$("banner"),msg=null;if(fetchErr)msg="Fetch failed: "+fetchErr;else if(a!=null&&a>30)msg="Data is stale: last update "+Math.round(a)+"s ago";else if(D&&D.time_ms&&(Date.now()-D.time_ms)/1000>30)msg="Server snapshot is older than 30s";
 b.style.display=msg?"block":"none";b.textContent=msg||""}

 var sh=all.filter(function(a){return a.x.kind==="SENTIMENT_SHADOW"}),used={};

  var flag=null;sh.forEach(function(s,i){if(s.r===a.r&&s.x.symbol===x.symbol&&(!x.strategy||!s.x.strategy||s.x.strategy===x.strategy)&&Math.abs(s.x.time_ms-x.time_ms)<120000){flag=s.x.reason;used[i]=1}});
  rows.push({t:x.time_ms,r:a.r,x:x,flag:flag})});

 rows.sort(function(a,b){return b.t-a.t});rows=rows.slice(0,60);
 $("feed").textContent="";$("feed").appendChild(table([["Time"],["Run"],["Strategy"],["Symbol"],["Side"],["Outcome"],["Reason / detail",0,1]],rows.map(function(o){var x=o.x,m=OUT[x.kind]||[x.kind,""],c=el("span");c.appendChild(chip(m[0],m[1]));

  var d=[x.reason,x.detail].filter(function(v){return v!==""&&v!=null}).join(" | ");
  return [ts(x.time_ms),o.r,x.strategy,x.symbol,x.side,c,d]}),"No signals yet \u2014 the six strategies are scanning the market"))}

/* ---------- fills, alerts ---------- */

 if(isDemo(r)){add(box,el("div","small mut","exchange orders (Binance Demo mirror)"));var m=r.mirror||{};
  box.appendChild(table([["Paper order"],["Symbol"],["Side"],["Qty",1],["Stop",1],["Stop client id"],["State"]],Object.keys(m).map(function(k){var o=m[k]||{},bad=o.state==="FAILED"||o.state==="CLOSE_FAILED";return [k.slice(-12),o.symbol,o.side,f(o.qty,4),f(o.stop,4),o.stop_cid,chip(o.state||"?",bad?"bad":o.state==="OPEN"?"ok":"off")]}),"No exchange orders yet \u2014 the mirror is idle"))}
 root.appendChild(box)})}

 a.sort(function(p,q){return (q.x.time_ms||Date.parse(q.x.iso)||0)-(p.x.time_ms||Date.parse(p.x.iso)||0)});
 var root=$("alerts");root.textContent="";a.slice(0,50).forEach(function(o){var d=el("div","alert a-"+o.x.level);add(d,ts(o.x.time_ms||Date.parse(o.x.iso)),"  ",chip(o.r),chip(o.x.level,o.x.level==="critical"?"bad":o.x.level==="warn"?"warn":"ok"),o.x.message||"");root.appendChild(d)});
 if(!a.length)root.appendChild(el("div","empty","All quiet \u2014 no alerts"))}

/* ---------- sentibot ---------- */
function cbar(v){var b=el("div","cbar"),i=el("i"),x=Math.max(-1,Math.min(1,v||0));i.style.background=x<0?"var(--bad)":"var(--ok)";i.style.left=(x<0?50+x*50:50)+"%";i.style.width=Math.abs(x)*50+"%";b.appendChild(i);return b}
function renderSenti(){var root=$("senti");root.textContent="";var sb=D.sentibot;
 if(!sb){root.appendChild(el("div","mut","sentibot not configured"));return}
 ["perp","spot"].forEach(function(k){var p=sb[k],box=el("div");add(box,el("b",null,k));
  if(!p||!p.available){add(box,el("div","mut","unavailable"));root.appendChild(box);return}
  var age=(Date.now()-Date.parse(p.time))/1000;add(box,el("div","small mut","equity "+money(p.equity)+" | reading "+ago(age)+" ago"));
  var src=el("div");src.style.margin="4px 0";var s=p.sources||{};Object.keys(s).forEach(function(n){var v=String(s[n]),c=v==="ok"?"ok":/^disabled/i.test(v)?"off":"warn",ch=chip(n+": "+(v==="ok"?"ok":c==="off"?"disabled":"unavailable"),c);ch.title=v;src.appendChild(ch)});
  var cn_=p.counts||{};Object.keys(cn_).forEach(function(n){src.appendChild(chip(n+" n="+cn_[n]))});box.appendChild(src);
  var coins=Object.keys(p.composite||{});box.appendChild(table([["Coin"],["Composite"],["",1],["News",1]],coins.map(function(c){var v=num(p.composite[c]),nw=(p.news||{})[c];return [c.replace("USDT",""),cbar(v),cn(v,f(v,2)),cn(num(nw),f(nw,2))]}).concat([["MARKET","","",cn(num((p.news||{})._market),f((p.news||{})._market,2))]])));
  root.appendChild(box)})}

var shown={};
function anim(node,key,to,fmt){var from=shown[key]!=null?shown[key]:to,t0=performance.now();shown[key]=to;
 (function step(t){var k=Math.min(1,(t-t0)/600),v=from+(to-from)*k;node.textContent=fmt(v);if(k<1)requestAnimationFrame(step)})(t0)}
function renderHero(){var h=$("hero");h.textContent="";var minor=[],crit=[],eqT=0,dlMin=null;
 D.runs.forEach(function(r){stages(r).forEach(function(s){if(s.c==="bad")crit.push(r.name+": "+s.n);else if(s.c==="warn"&&s.n.indexOf("Sentiment")<0&&s.n.indexOf("mirror")<0)minor.push(r.name+": "+s.n)});
  var q=num(eng(r).equity);if(q!=null)eqT+=q;var d=(r.run||{}).deadline_ms;if(d&&(dlMin==null||d<dlMin))dlMin=d});
 h.className="hero"+(crit.length?" bad":minor.length?" warn":"");
 var st=el("div","hs"),dt=el("span","dot live");dt.style.background="#fff";
 add(st,dt,crit.length?"Attention needed: "+crit.join("; "):minor.length?"Running, minor issues: "+minor.join("; "):"All systems healthy");h.appendChild(st);
 var g=el("div","hg"),base=50*D.runs.length;
 function cell(l,tp,node,sub){var d=el("div"),sp=el("span",null,l);sp.title=tp;d.appendChild(sp);var b=el("b");b.appendChild(node);d.appendChild(b);if(sub)d.appendChild(el("div","sub",sub));g.appendChild(d)}
 var e1=el("span"),e2=el("span"),dc=el("span");dc.setAttribute("data-dl",dlMin);dc.textContent=countdown(dlMin);
 cell("Total equity","Combined account value of all runs",e1,"started with $"+base);
 cell("Total PnL","Profit / loss versus the $50 starting balance per run",e2,D.runs.map(function(r){var q=num(eng(r).equity);return r.name+" "+(q==null?"-":money(q-50))}).join("  |  "));
 cell("Time left","Countdown to the end of the test run (deadline)",dc,dlMin?new Date(dlMin).toISOString().slice(0,16).replace("T"," ")+" UTC":"");
 cell("Runs live","Runs reporting a running status",el("span",null,D.runs.filter(function(r){return (r.run||{}).status==="running"}).length+"/"+D.runs.length));
 h.appendChild(g);anim(e1,"eq",eqT,money);anim(e2,"pn",eqT-base,function(v){return (v>=0?"+":"")+money(v)+" ("+(v/base*100).toFixed(2)+"%)"})}
function render(){renderHero();renderFlow();renderRuns();renderFeed();renderFills();renderAlerts();renderSenti()}
function poll(){fetch("/api/state",{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(j){D=j;lastOk=Date.now();fetchErr=null;try{render()}catch(e){fetchErr="render error: "+e.message}tick()}).catch(function(e){fetchErr=String(e.message||e);tick()})}
poll();setInterval(poll,5000);setInterval(tick,1000);
</script></body></html>
